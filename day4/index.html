<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Counter + Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture ideas before they disappear</p>
        <nav>
            <a href="index.html">Home</a>
            
            <button id="themeBtn">Dark Mode</button>
        </nav>
    </header>
    <main>
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input">New note</label>
                <textarea id="note-input" placeholder="Start typing..." maxlength="300"></textarea>
                
                <div class="stats">
                    <p>Characters: <span id="charCount">0</span></p>
                    <p>Words: <span id="wordCount">0</span></p>
                    <p id="warning"></p>
                </div>

                <button type="submit">Add Note</button>
                <button type="button" id="clearBtn">Clear</button>
                <p id="char-limit-msg"></p>
            </form>
        </section>
        <section>
            <h2>Your notes</h2>
            <p id="note-count">You have 0 notes</p>
            <ul id="notes-list"></ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 QuickNotes. Built during PLP.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
